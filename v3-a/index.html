<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>咬合拼图 · v3.0-A 落位生长原型</title>
<style>
  :root{
    --bg:#0f131a; --panel:#171d28; --panel2:#1d2533; --line:#2a3446;
    --text:#e7ecf5; --dim:#8d99ad; --accent:#ffb454; --good:#6ee7b7; --bad:#fb7185;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,"PingFang SC","Noto Sans SC",system-ui,sans-serif;
    user-select:none;overflow:hidden}
  #app{height:100%;max-width:430px;margin:0 auto;display:flex;flex-direction:column;
    padding:7px 10px 9px;gap:6px}
  header{display:flex;align-items:center;gap:8px;height:30px;padding:0 2px}
  .lv{font-size:14px;font-weight:700}.lv b{color:var(--accent)}
  .spacer{flex:1}
  .prog{font-size:12px;color:var(--dim)}
  .timer{font-size:12px;color:var(--dim)}
  #frameWrap{flex:0 0 auto;display:flex;justify-content:center}
  #frame{position:relative;border-radius:10px;background:#141a24;border:1px solid var(--line);
    box-shadow:0 8px 24px rgba(0,0,0,.35);overflow:hidden}
  #frame .ghost{position:absolute;inset:0;background-repeat:no-repeat;background-size:100% 100%;opacity:.18}
  .cell{position:absolute;border:1px dashed #2c3749;border-radius:2px;background:rgba(255,255,255,.012)}
  .cell.frontier{border-color:rgba(255,180,84,.55);background:rgba(255,180,84,.06)}
  .cell.bad{animation:bad .3s}
  @keyframes bad{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
  .placed{position:absolute;background-repeat:no-repeat;border-radius:2px;
    animation:pop .22s ease-out;box-shadow:inset 0 0 0 1px rgba(0,0,0,.28)}
  @keyframes pop{0%{transform:scale(.5);opacity:.25}100%{transform:scale(1);opacity:1}}
  .je{position:absolute;pointer-events:none;box-sizing:border-box;border-radius:50%}
  .je.big{width:30%;height:30%}.je.small{width:18%;height:18%}
  .je.tab{background:rgba(255,255,255,.86);border:1.5px solid rgba(0,0,0,.4);box-shadow:0 1px 3px rgba(0,0,0,.5)}
  .je.blank{background:#0b0f16;border:1.5px solid rgba(0,0,0,.6);box-shadow:inset 0 1px 3px rgba(0,0,0,.9)}
  .je.flat{background:rgba(255,255,255,.34);border-radius:1px}
  .je.side-top{left:50%;top:0;transform:translate(-50%,-50%)}
  .je.side-bottom{left:50%;bottom:0;transform:translate(-50%,50%)}
  .je.side-left{top:50%;left:0;transform:translate(-50%,-50%)}
  .je.side-right{top:50%;right:0;transform:translate(50%,-50%)}
  .je.flat.side-top,.je.flat.side-bottom{width:52%;height:2px;border-radius:1px}
  .je.flat.side-left,.je.flat.side-right{height:52%;width:2px;border-radius:1px}
  #stackWrap{position:relative;flex:1;min-height:170px;background:#121824;border:1px solid var(--line);
    border-radius:12px;overflow:hidden}
  #stackWrap .head{position:absolute;left:8px;top:6px;font-size:11px;color:var(--dim);z-index:5}
  #stack{position:absolute;inset:0}
  .sp{position:absolute;border-radius:6px;background-repeat:no-repeat;cursor:pointer;
    box-shadow:0 3px 8px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.14);
    border:1.5px solid rgba(0,0,0,.5);transition:filter .15s,opacity .15s}
  .sp.blocked{filter:grayscale(.75) brightness(.5);cursor:default;pointer-events:none}
  .sp .glyph{display:none}
  #handBar{background:#121824;border:1px solid var(--line);border-radius:12px;padding:6px 9px 7px}
  .handTitle{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-bottom:3px}
  #hand{display:flex;gap:8px;justify-content:center;min-height:52px}
  .slot{width:52px;height:52px;border:1px dashed #33405a;border-radius:8px;position:relative;
    display:flex;align-items:center;justify-content:center;color:#44546e;font-size:11px}
  .slot.filled{border-style:solid;border-color:#3d4b64;background:#101620;cursor:pointer}
  .slot.filled.selected{border-color:var(--accent);box-shadow:0 0 0 2px rgba(255,180,84,.25)}
  .trayPiece{position:relative;width:48px;height:48px;background-repeat:no-repeat;border-radius:5px}
  .actions{display:flex;gap:8px}
  .actions button{flex:1;height:36px;border-radius:10px;border:1px solid var(--line);
    background:var(--panel);color:var(--text);font-size:13px;display:flex;align-items:center;justify-content:center;gap:4px}
  .actions button:active{background:var(--panel2)}
  #modalBg{position:fixed;inset:0;background:rgba(6,9,14,.72);display:none;align-items:center;
    justify-content:center;padding:24px;z-index:20;backdrop-filter:blur(2px)}
  #modalBg.show{display:flex}
  #modal{width:100%;max-width:340px;background:linear-gradient(180deg,#1b2331,#151b26);
    border:1px solid #33405a;border-radius:16px;padding:18px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.5)}
  #modal h2{margin:0 0 8px;font-size:20px}
  #modal p{color:var(--dim);font-size:13px;line-height:1.6;margin:6px 0}
  #modal .btns{display:flex;gap:8px;margin-top:14px}
  #modal .btns button{flex:1;height:40px;border-radius:10px;border:1px solid var(--line);
    background:var(--panel);color:var(--text);font-size:14px}
  #modal .btns button.primary{background:linear-gradient(180deg,#ffc46b,#f59e0b);border-color:#f59e0b;color:#241a06;font-weight:700}
  #toast{position:fixed;left:50%;bottom:118px;transform:translateX(-50%);background:rgba(23,29,40,.96);
    border:1px solid #33405a;color:var(--text);font-size:12px;padding:8px 14px;border-radius:20px;
    opacity:0;transition:opacity .18s;pointer-events:none;max-width:86vw;text-align:center;z-index:30}
  #toast.show{opacity:1}
  .region-flash{position:absolute;border-radius:6px;border:2px solid var(--good);
    box-shadow:0 0 18px rgba(110,231,183,.55);pointer-events:none;animation:rflash .6s ease-out forwards}
  @keyframes rflash{0%{opacity:.95}100%{opacity:0}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="lv">第 <b id="lvNum">1</b> 关</div>
    <div class="spacer"></div>
    <div class="prog" id="prog">0/24</div>
    <div class="timer" id="timer">00:00</div>
  </header>
  <div id="frameWrap"><div id="frame"></div></div>
  <div id="stackWrap">
    <div class="head" id="stackHead">堆叠盘面 · 只有亮的能取</div>
    <div id="stack"></div>
  </div>
  <div id="handBar">
    <div class="handTitle"><span>卡槽（选中 → 点画面上它该在的位置）</span><span id="handCap">0/4</span></div>
    <div id="hand"></div>
  </div>
  <div class="actions">
    <button id="btnHint">提示</button>
    <button id="btnRescue">救援 <em id="rescueCount">1</em></button>
    <button id="btnRestart">重开</button>
  </div>
</div>
<div id="modalBg"><div id="modal"></div></div>
<div id="toast"></div>
<script>
/* ================= 画面（占位，正式版换原画） ================= */
const SCENE = (() => {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320">
    <defs><linearGradient id="s" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16325c"/><stop offset=".5" stop-color="#3f6fa3"/>
      <stop offset=".78" stop-color="#e08d63"/><stop offset="1" stop-color="#f2c98a"/></linearGradient>
      <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b5f8b"/><stop offset="1" stop-color="#132b42"/></linearGradient></defs>
    <rect width="480" height="320" fill="url(#s)"/>
    <circle cx="356" cy="86" r="34" fill="#ffd166"/>
    <circle cx="356" cy="86" r="52" fill="#ffd166" opacity=".16"/>
    <path d="M0 208 L70 150 L128 196 L196 156 L266 214 L0 214Z" fill="#2a3c5a"/>
    <path d="M0 226 L96 176 L186 232 L286 190 L480 238 L480 320 L0 320Z" fill="#1b2940"/>
    <rect y="238" width="480" height="82" fill="url(#sea)"/>
    <path d="M0 258 Q60 252 120 260 T240 258 T360 260 T480 256" stroke="#7fb3d5" stroke-width="2.5" fill="none" opacity=".5"/>
    <path d="M46 238 q10 -30 34 -36 q-16 8 -13 36Z" fill="#101d2f"/>
  </svg>`;
  return 'data:image/svg+xml,' + encodeURIComponent(svg);
})();

/* ================= 关卡 ================= */
const STRICT = /[?&]strict=1/.test(location.search);
const LEVELS = [
  { cols: 6, rows: 4, size: 54, tray: 4, layers: 3, seed: 11 },
  { cols: 7, rows: 4, size: 48, tray: 4, layers: 3, seed: 23 },
  { cols: 7, rows: 5, size: 46, tray: 4, layers: 4, seed: 37 },
];

const $ = id => document.getElementById(id);
let S = null;

function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1500); }
function modal(html){ $('modal').innerHTML=html; $('modalBg').classList.add('show'); }
function closeModal(){ $('modalBg').classList.remove('show'); }

function rngFactory(a){ return function(){ a|=0; a=(a+0x6D2B79F5)|0;
  let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t;
  return ((t^(t>>>14))>>>0)/4294967296; }; }

/* 生成：画面网格 + 边缘 + 堆叠位置 */
function generate(idx){
  const cfg = LEVELS[idx];
  const rng = rngFactory(cfg.seed);
  const { cols, rows } = cfg;
  const total = cols * rows;
  const edges = [];
  for (let r=0;r<rows;r++){ edges[r]=[];
    for (let c=0;c<cols;c++){
      const e={};
      e.top = r===0 ? 'flat' : opp(edges[r-1][c].bottom);
      e.left = c===0 ? 'flat' : opp(edges[r][c-1].right);
      e.right = c===cols-1 ? 'flat' : (rng()<0.5?'tab':'blank');
      e.bottom = r===rows-1 ? 'flat' : (rng()<0.5?'tab':'blank');
      edges[r][c]=e;
    }
  }
  // 堆叠区 340×230；随机层 + 位置，计算遮挡
  const AW = 340, AH = 230, sz = cfg.size;
  const pieces = [];
  for (let id=0; id<total; id++){
    const layer = Math.floor(rng()*cfg.layers);
    const x = Math.round(rng()*(AW-sz));
    const y = Math.round(rng()*(AH-sz));
    pieces.push({ id, r: Math.floor(id/cols), c: id%cols, x, y, layer,
      size: sz, location: 'stack', blockedBy: [] });
  }
  // 遮挡：更高层且重叠 ≥15%
  for (const a of pieces){
    for (const b of pieces){
      if (b === a || b.layer <= a.layer) continue;
      const ox = Math.max(0, Math.min(a.x+a.size,b.x+b.size)-Math.max(a.x,b.x));
      const oy = Math.max(0, Math.min(a.y+a.size,b.y+b.size)-Math.max(a.y,b.y));
      if (ox*oy >= 0.15*a.size*a.size) a.blockedBy.push(b.id);
    }
  }
  return { level: idx, cols, rows, total, edges, pieces, tray: [], selected: null,
    placed: new Set(), trayCap: cfg.tray, rescueLeft: 1, done: false, start: Date.now() };
}
function opp(e){ return e==='tab'?'blank':e==='blank'?'tab':'flat'; }

/* ================= 渲染 ================= */
function layoutFrame(){
  const f = $('frame');
  const avail = Math.min(360, f.parentNode.clientWidth || 360);
  const cell = Math.floor((avail-2)/S.cols);
  const w = cell*S.cols, h = cell*S.rows;
  S.cell = cell; S.picW = w; S.picH = h;
  f.style.width = w+'px'; f.style.height = h+'px';
  f.innerHTML = '<div class="ghost"></div>';
  f.querySelector('.ghost').style.backgroundImage = `url("${SCENE}")`;
  for (let id=0; id<S.total; id++){
    const r=Math.floor(id/S.cols), c=id%S.cols;
    if (S.placed.has(id)) { f.appendChild(makePlaced(id,r,c,cell)); continue; }
    const d=document.createElement('div');
    d.className='cell'; d.dataset.id=id;
    d.style.left=c*cell+'px'; d.style.top=r*cell+'px';
    d.style.width=d.style.height=cell+'px';
    f.appendChild(d);
  }
  renderFrontier();
  $('prog').textContent = S.placed.size + '/' + S.total;
}
function makePlaced(id,r,c,cell){
  const d=document.createElement('div');
  d.className='placed';
  d.style.left=c*cell+'px'; d.style.top=r*cell+'px';
  d.style.width=d.style.height=cell+'px';
  d.style.backgroundImage=`url("${SCENE}")`;
  d.style.backgroundSize=`${S.picW}px ${S.picH}px`;
  d.style.backgroundPosition=`${-c*cell}px ${-r*cell}px`;
  addEdges(d,r,c,cell);
  return d;
}
function addEdges(el,r,c,cell){
  const e=S.edges[r][c];
  const big = Math.max(4, Math.round(cell*0.24));
  const small = Math.max(4, Math.round(cell*0.18));
  const put=(side,cls,size)=>{
    const s=document.createElement('i');
    s.className='je '+cls+' side-'+side;
    if (size) { s.style.width = s.style.height = size + 'px'; }
    el.appendChild(s);
  };
  ['top','right','bottom','left'].forEach(side=>{
    if (e[side]==='flat') put(side,'flat',0);
    else put(side, e[side], big);
  });
}
function renderFrontier(){
  const f=$('frame');
  const frontier=new Set();
  if (S.placed.size===0){ for(let id=0; id<S.total; id++) frontier.add(id); }
  else S.placed.forEach(id=>{
    const r=Math.floor(id/S.cols), c=id%S.cols;
    [[r-1,c],[r+1,c],[r,c-1],[r,c+1]].forEach(([nr,nc])=>{
      if(nr<0||nc<0||nr>=S.rows||nc>=S.cols) return;
      const nid=nr*S.cols+nc;
      if(!S.placed.has(nid)) frontier.add(nid);
    });
  });
  f.querySelectorAll('.cell').forEach(cell=>{
    const on=frontier.has(+cell.dataset.id);
    cell.classList.toggle('frontier',on);
  });
  S.frontier=frontier;
}

/* 堆叠盘面 */
function renderStack(){
  const st=$('stack'); st.innerHTML='';
  let alive=0;
  S.pieces.slice().sort((a,b)=>a.layer-b.layer).forEach(p=>{
    if(p.location!=='stack') return;
    alive++;
    const d=document.createElement('div');
    d.className='sp';
    d.dataset.id=p.id;
    d.style.left=p.x+'px'; d.style.top=p.y+'px';
    d.style.width=p.size+'px'; d.style.height=p.size+'px';
    d.style.zIndex=p.layer*1000+p.id;
    d.style.backgroundImage=`url("${SCENE}")`;
    d.style.backgroundSize=`${S.cols*p.size}px ${S.rows*p.size}px`;
    d.style.backgroundPosition=`${-p.c*p.size}px ${-p.r*p.size}px`;
    d.style.borderColor = p.orientation==='tab'?'rgba(0,0,0,.5)':'rgba(0,0,0,.5)';
    addEdges(d,p.r,p.c,p.size);
    if (blockedCount(p.id)>0) d.classList.add('blocked');
    else d.addEventListener('click',()=>pick(p.id));
    st.appendChild(d);
  });
  $('stackHead').textContent = '堆叠盘面 · 剩 ' + alive + ' 块 · 只有亮的能取';
}
function blockedCount(id){
  const p=S.pieces[id];
  return p.blockedBy.filter(b=>{
    const q=S.pieces[b];
    return q && q.location==='stack';
  }).length;
}

/* 卡槽 */
function renderTray(){
  const h=$('hand'); h.innerHTML='';
  for(let i=0;i<S.trayCap;i++){
    const slot=document.createElement('div');
    slot.className='slot';
    const p=S.tray[i];
    if(p){
      slot.classList.add('filled');
      if(S.selected===p.id) slot.classList.add('selected');
      const d=document.createElement('div');
      d.className='trayPiece';
      d.style.backgroundImage=`url("${SCENE}")`;
      d.style.backgroundSize=`${S.cols*48}px ${S.rows*48}px`;
      d.style.backgroundPosition=`${-p.c*48}px ${-p.r*48}px`;
      addEdges(d,p.r,p.c,48);
      slot.appendChild(d);
      slot.addEventListener('click',()=>selectTray(p.id));
    } else slot.textContent='空';
    h.appendChild(slot);
  }
  $('handCap').textContent=S.tray.length+'/'+S.trayCap;
  $('rescueCount').textContent=S.rescueLeft;
}

/* ================= 交互 ================= */
function pick(id){
  if(!S || S.done) return;
  const p=S.pieces[id];
  if(!p || p.location!=='stack') return;
  if(blockedCount(id)>0){ toast('这块被压住了'); return; }
  if(S.tray.length>=S.trayCap){ toast('卡槽满了，先放一块到画面上'); return; }
  p.location='tray';
  S.tray.push(p);
  S.selected=p.id;
  renderStack(); renderTray(); renderFrontier();
  checkStuck();
}
function selectTray(id){
  if(S.done) return;
  S.selected = (S.selected===id?null:id);
  renderTray();
  if(S.selected!=null) toast('已选中，点画面上它该在的位置');
}
function place(id){
  if(!S || S.done) return;
  if(S.selected==null){ toast('先在卡槽里选中一块'); return; }
  const p=S.pieces[S.selected];
  if(!p || p.location!=='tray') return;
  const cellEl = $('frame').querySelector(`.cell[data-id="${id}"]`);
  if(p.id!==id){
    if(cellEl){ cellEl.classList.add('bad'); setTimeout(()=>cellEl.classList.remove('bad'),320); }
    toast('位置不对：看图案和卡口');
    return;
  }
  if (S.placed.size > 0 && !isAdjacent(id)){
    if (STRICT) { toast('严格模式：必须接在已拼区域旁'); return; }
    toast('接不上已拼区域：先单独放下，尽量挨着拼');
  }
  p.location='placed';
  S.placed.add(id);
  S.tray = S.tray.filter(x=>x.id!==id);
  S.selected=null;
  renderStack(); renderTray(); layoutFrame(); regionFeedback();
  checkWin();
}
function isAdjacent(id){
  const r=Math.floor(id/S.cols), c=id%S.cols;
  return [[r-1,c],[r+1,c],[r,c-1],[r,c+1]].some(([nr,nc])=>{
    if(nr<0||nc<0||nr>=S.rows||nc>=S.cols) return false;
    return S.placed.has(nr*S.cols+nc);
  });
}
function placeableInTray(p){
  return true;  // v3-A 原型：允许独立落位，邻接只做"推荐"
}
function checkStuck(){
  if(S.tray.length<S.trayCap) return;
  if(S.tray.some(placeableInTray)) return;
  modal('<h2>卡槽满了</h2><p>手里这几块都接不上已拼区域。救援会把卡槽里的碎片放回盘面（每关 1 次）。</p>' +
    '<div class="btns"><button class="primary" id="mRescue">救援（剩 '+S.rescueLeft+'）</button>' +
    '<button id="mRestart">重开</button></div>');
  $('mRescue').onclick=()=>{ closeModal(); rescue(); };
  $('mRestart').onclick=()=>{ closeModal(); restart(); };
}
function rescue(){
  if(S.rescueLeft<=0){ toast('本关救援用完了'); return; }
  if(!S.tray.length){ toast('卡槽是空的'); return; }
  S.rescueLeft--;
  const topLayer = Math.max(...S.pieces.map(p=>p.layer)) + 1;
  S.tray.forEach(p=>{
    p.location='stack';
    p.layer = topLayer;
    p.blockedBy = [];
    p.x = 20 + Math.round(Math.random()*200);
    p.y = 20 + Math.round(Math.random()*120);
  });
  S.tray=[]; S.selected=null;
  renderStack(); renderTray(); renderFrontier();
  toast('已把卡槽碎片放回盘面');
}
function checkWin(){
  if(S.placed.size!==S.total) return;
  S.done=true;
  const sec=Math.round((Date.now()-S.start)/1000);
  modal('<h2>拼好了！</h2>' +
    '<div style="width:240px;height:160px;margin:8px auto;border-radius:10px;background-image:url(\''+SCENE+'\');background-size:cover;box-shadow:0 8px 30px rgba(0,0,0,.5)"></div>' +
    '<p>用时 '+Math.floor(sec/60)+' 分 '+(sec%60)+' 秒 · '+S.total+' 块</p>' +
    '<div class="btns"><button class="primary" id="mNext">下一关</button><button id="mAgain">重玩</button></div>');
  $('mNext').onclick=()=>{ closeModal(); startLevel(Math.min(LEVELS.length-1,S.level+1)); };
  $('mAgain').onclick=()=>{ closeModal(); restart(); };
}
/* 区域生长反馈：4/9/16 块里程碑 */
function regionFeedback(){
  const n=S.placed.size;
  if(n===4||n===9||n===16){
    toast('区域已连成 '+n+' 块！');
    const f=$('frame');
    const fl=document.createElement('div');
    fl.className='region-flash'; fl.style.inset='2px';
    f.appendChild(fl);
    setTimeout(()=>fl.remove(),650);
  }
  // 最大连通区域显示
  const comp = largestComponent();
  $('stackHead').textContent = '堆叠盘面 · 剩 ' + S.pieces.filter(p=>p.location==='stack').length +
    ' 块 · 已拼 ' + n + '/' + S.total + ' · 最大区域 ' + comp;
}
function largestComponent(){
  const seen=new Set(); let best=0;
  for(const id of S.placed){
    if(seen.has(id)) continue;
    let cnt=0; const q=[id]; seen.add(id);
    while(q.length){ const cur=q.pop(); cnt++;
      const r=Math.floor(cur/S.cols), c=cur%S.cols;
      [[r-1,c],[r+1,c],[r,c-1],[r,c+1]].forEach(([nr,nc])=>{
        if(nr<0||nc<0||nr>=S.rows||nc>=S.cols) return;
        const nid=nr*S.cols+nc;
        if(S.placed.has(nid)&&!seen.has(nid)){ seen.add(nid); q.push(nid); }
      });
    }
    if(cnt>best) best=cnt;
  }
  return best;
}
function hint(){
  if(!S||S.done) return;
  const f=$('frame');
  f.querySelectorAll('.cell.hint').forEach(c=>c.classList.remove('hint'));
  if(S.selected!=null){
    const p=S.pieces[S.selected];
    const el=f.querySelector(`.cell[data-id="${p.id}"]`);
    if(el){ el.classList.add('hint'); setTimeout(()=>el.classList.remove('hint'),1500); }
    toast('这块该放在高亮格（推荐先接已拼区域）');
  } else {
    const cand=S.tray.find(placeableInTray);
    if(cand){ S.selected=cand.id; renderTray(); toast('已帮你选中一块可放的'); }
    else toast('卡槽里没有能接上的，取新碎片或救援');
  }
}
function updateHud(){
  $('lvNum').textContent=S.level+1;
  $('prog').textContent=S.placed.size+'/'+S.total;
  $('rescueCount').textContent=S.rescueLeft;
}
function startLevel(idx){
  S=generate(idx);
  closeModal();
  $('frame').onclick=e=>{ const c=e.target.closest('.cell'); if(c) place(+c.dataset.id); };
  layoutFrame(); renderStack(); renderTray(); updateHud(); regionFeedback();
}
function restart(){ startLevel(S.level); }

$('btnHint').onclick=hint;
$('btnRescue').onclick=()=>{ if(S.tray.length) rescue(); else toast('卡槽是空的'); };
$('btnRestart').onclick=restart;
setInterval(()=>{ if(!S||S.done) return;
  const sec=Math.round((Date.now()-S.start)/1000);
  $('timer').textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');
},500);

/* 调试 */
window.__grow = {
  state:()=>S,
  pick, selectTray, place, startLevel,
  autoSolve(){
    let guard=0;
    while(!S.done && guard++<600){
      // 找卡槽里可放的
      const can=S.tray.find(placeableInTray);
      if(can){ S.selected=can.id; place(can.id); continue; }
      const av = S.pieces.find(p=>p.location==='stack' && blockedCount(p.id)===0);
      if(!av){ if(S.rescueLeft>0){ rescue(); continue; } break; }
      pick(av.id);
      if(S.tray.length>=S.trayCap && !S.tray.some(placeableInTray)){
        if(S.rescueLeft>0) rescue(); else break;
      }
    }
    return S.done;
  }
};

startLevel(0);
</script>
